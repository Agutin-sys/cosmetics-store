name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # или "master", если у вас так называется основная ветка

permissions:
  contents: write # разрешаем workflow пушить в gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # или npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # cname: 'www.example.com' # если у вас есть свой домен, раскомментируйте